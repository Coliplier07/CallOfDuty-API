name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "chore/**"
      - "docs/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-check:
    name: Repository Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        shell: bash
        run: |
          test -f README.md
          test -f AI_USAGE.md
          test -f .env.example
          test -f docker-compose.yml
          test -f .github/workflows/ci.yml
          test -d apps/api
          test -d apps/mobile

      - name: Validate Docker Compose
        run: docker compose config

  api:
    name: API Checks
    runs-on: ubuntu-latest
    needs: repository-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Check API package
        shell: bash
        run: |
          if [ ! -f apps/api/package.json ]; then
            echo "API package.json has not been created yet."
            exit 0
          fi

      - name: Install API dependencies
        if: ${{ hashFiles('apps/api/package-lock.json') != '' }}
        working-directory: apps/api
        run: npm ci

      - name: Lint API
        if: ${{ hashFiles('apps/api/package.json') != '' }}
        working-directory: apps/api
        run: npm run lint --if-present

      - name: Type-check API
        if: ${{ hashFiles('apps/api/package.json') != '' }}
        working-directory: apps/api
        run: npm run type-check --if-present

      - name: Test API
        if: ${{ hashFiles('apps/api/package.json') != '' }}
        working-directory: apps/api
        run: npm test --if-present

  mobile:
    name: Mobile Checks
    runs-on: ubuntu-latest
    needs: repository-check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check mobile project
        shell: bash
        run: |
          if [ ! -f apps/mobile/package.json ]; then
            echo "Expo mobile project has not been initialized yet."
            exit 0
          fi

      - name: Setup Node.js
        if: ${{ hashFiles('apps/mobile/package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        if: ${{ hashFiles('apps/mobile/package-lock.json') != '' }}
        working-directory: apps/mobile
        run: npm ci

      - name: Type-check mobile
        if: ${{ hashFiles('apps/mobile/package.json') != '' }}
        working-directory: apps/mobile
        run: npm run type-check --if-present

      - name: Lint mobile
        if: ${{ hashFiles('apps/mobile/package.json') != '' }}
        working-directory: apps/mobile
        run: npm run lint --if-present
