services:
  postgres:
    image: postgres:17
    container_name: cod-stats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cod_stats}
      POSTGRES_USER: ${POSTGRES_USER:-cod_stats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cod_stats} -d ${POSTGRES_DB:-cod_stats}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
